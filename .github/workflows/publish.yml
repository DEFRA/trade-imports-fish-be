name: Publish

on:
  push:
    branches:
      - main
      - chore/FISB-197-be-feature-branch-deployment
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    if: >-
      (github.event_name == 'push' && github.run_number != 1 && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/chore/FISB-197-be-feature-branch-deployment')
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.ref_name == 'main' && 1 || 0 }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure publishing settings
        id: publish-settings
        run: node scripts/configure-publish-settings.js

      - name: Set up Java
        if: github.ref == 'refs/heads/chore/FISB-197-be-feature-branch-deployment'
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      - name: Run tests
        if: github.ref == 'refs/heads/chore/FISB-197-be-feature-branch-deployment'
        run: mvn -B -e clean verify

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.publish-settings.outputs.prerelease }}
          prerelease-suffix: ${{ steps.publish-settings.outputs.prerelease-suffix }}
          push-dockerhub: ${{ steps.publish-settings.outputs.push-dockerhub }}
  sonarcloud-scan:
    name: SonarCloud Scan
    uses: ./.github/workflows/sonarcloud.yml
    needs: build
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
