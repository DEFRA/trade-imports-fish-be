name: Run SonarCloud coverage scan

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: SonarCloud coverage scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      - name: Prepare Sonar cache directory
        run: mkdir -p ~/.sonar/cache

      - name: Cache Sonar Scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test, and Sonar analyze
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -e clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.token="${SONAR_TOKEN}"
